services:
  # ─────────────────────────────────────────────
  # Next.js Frontend (admit.abroadsimplified.com)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyC9t0lqpr7r9cGqDHWprXt972HUTR6LlGo}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-abroad-simplified.firebaseapp.com}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-abroad-simplified}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-abroad-simplified.firebasestorage.app}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-829246439395}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:829246439395:web:f63036bb6c25a66281ead6}
    container_name: abroad-admin-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - abroad-network

  # ─────────────────────────────────────────────
  # FastAPI Backend (Python)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abroad-admin-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    networks:
      - abroad-network

networks:
  abroad-network:
    driver: bridge

volumes:
  backend-data:
