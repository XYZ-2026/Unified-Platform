services:
  # ─────────────────────────────────────────────
  # Next.js Frontend (admit.abroadsimplified.com)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: abroad-admin-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - abroad-network

  # ─────────────────────────────────────────────
  # FastAPI Backend (Python)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abroad-admin-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    networks:
      - abroad-network

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy + SSL
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: abroad-admin-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - abroad-network

  # ─────────────────────────────────────────────
  # Certbot (Let's Encrypt SSL auto-renewal)
  # ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: abroad-admin-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - abroad-network

networks:
  abroad-network:
    driver: bridge

volumes:
  backend-data:
  certbot-webroot:
