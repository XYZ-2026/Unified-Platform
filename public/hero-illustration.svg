<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- Background globe -->
  <circle cx="300" cy="310" r="200" fill="#FDF4F4" stroke="#690b1b" stroke-width="2" opacity="0.3"/>
  <ellipse cx="300" cy="310" rx="200" ry="70" fill="none" stroke="#690b1b" stroke-width="1.5" opacity="0.2"/>
  <ellipse cx="300" cy="310" rx="70" ry="200" fill="none" stroke="#690b1b" stroke-width="1.5" opacity="0.2"/>
  <path d="M100 310 Q200 280 300 310 Q400 340 500 310" fill="none" stroke="#690b1b" stroke-width="1" opacity="0.15"/>
  <path d="M100 310 Q200 340 300 310 Q400 280 500 310" fill="none" stroke="#690b1b" stroke-width="1" opacity="0.15"/>
  
  <!-- Floating clouds -->
  <g opacity="0.6">
    <ellipse cx="150" cy="180" rx="50" ry="20" fill="#E8F4FD"/>
    <ellipse cx="130" cy="175" rx="30" ry="15" fill="#E8F4FD"/>
    <ellipse cx="170" cy="175" rx="35" ry="18" fill="#E8F4FD"/>
  </g>
  <g opacity="0.4">
    <ellipse cx="480" cy="220" rx="45" ry="18" fill="#E8F4FD"/>
    <ellipse cx="460" cy="215" rx="28" ry="14" fill="#E8F4FD"/>
    <ellipse cx="500" cy="215" rx="32" ry="16" fill="#E8F4FD"/>
  </g>
  <g opacity="0.5">
    <ellipse cx="100" cy="400" rx="40" ry="16" fill="#E8F4FD"/>
    <ellipse cx="80" cy="395" rx="25" ry="12" fill="#E8F4FD"/>
    <ellipse cx="120" cy="395" rx="28" ry="14" fill="#E8F4FD"/>
  </g>
  
  <!-- Student body -->
  <g transform="translate(300, 300)">
    <!-- Backpack -->
    <rect x="-35" y="-30" width="30" height="45" rx="8" fill="#8D1212"/>
    <rect x="-32" y="-20" width="24" height="15" rx="4" fill="#690b1b"/>
    <line x1="-20" y1="-30" x2="-20" y2="-40" stroke="#690b1b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body/Torso -->
    <rect x="-25" y="-40" width="50" height="60" rx="12" fill="#690b1b"/>
    
    <!-- Arms -->
    <rect x="-35" y="-35" width="15" height="45" rx="7" fill="#690b1b"/>
    <rect x="20" y="-35" width="15" height="45" rx="7" fill="#690b1b"/>
    
    <!-- Right hand holding book -->
    <rect x="22" y="5" width="20" height="15" rx="3" fill="#F4B400"/>
    <line x1="25" y1="8" x2="39" y2="8" stroke="#fff" stroke-width="1.5"/>
    <line x1="25" y1="12" x2="35" y2="12" stroke="#fff" stroke-width="1"/>
    <line x1="25" y1="16" x2="37" y2="16" stroke="#fff" stroke-width="1"/>
    
    <!-- Neck -->
    <rect x="-8" y="-52" width="16" height="15" rx="4" fill="#D4956A"/>
    
    <!-- Head -->
    <circle cx="0" cy="-68" r="24" fill="#D4956A"/>
    
    <!-- Hair -->
    <path d="M-24 -72 Q-24 -95 0 -95 Q24 -95 24 -72 Q24 -80 18 -82 Q10 -85 0 -82 Q-10 -85 -18 -82 Q-24 -80 -24 -72Z" fill="#2D303C"/>
    
    <!-- Eyes -->
    <circle cx="-8" cy="-70" r="3" fill="#2D303C"/>
    <circle cx="8" cy="-70" r="3" fill="#2D303C"/>
    <circle cx="-7" cy="-71" r="1" fill="#fff"/>
    <circle cx="9" cy="-71" r="1" fill="#fff"/>
    
    <!-- Smile -->
    <path d="M-6 -60 Q0 -55 6 -60" fill="none" stroke="#2D303C" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Legs -->
    <rect x="-18" y="18" width="16" height="40" rx="6" fill="#374151"/>
    <rect x="2" y="18" width="16" height="40" rx="6" fill="#374151"/>
    
    <!-- Shoes -->
    <rect x="-20" y="52" width="20" height="10" rx="5" fill="#1F2937"/>
    <rect x="0" y="52" width="20" height="10" rx="5" fill="#1F2937"/>
  </g>
  
  <!-- Floating airplane 1 -->
  <g transform="translate(450, 150) rotate(-15)">
    <path d="M0 0 L30 -5 L35 -15 L38 -5 L60 -8 L38 0 L40 10 L35 2 L0 0Z" fill="#F4B400"/>
    <path d="M15 -2 L15 -12 L20 -12 L20 0Z" fill="#FFCB05" opacity="0.7"/>
  </g>
  
  <!-- Floating airplane 2 -->
  <g transform="translate(100, 280) rotate(20) scale(0.7)">
    <path d="M0 0 L30 -5 L35 -15 L38 -5 L60 -8 L38 0 L40 10 L35 2 L0 0Z" fill="#690b1b" opacity="0.6"/>
  </g>
  
  <!-- Graduation cap -->
  <g transform="translate(460, 380)">
    <polygon points="0,-15 30,0 0,15 -30,0" fill="#690b1b"/>
    <rect x="-15" y="0" width="30" height="12" fill="#8D1212"/>
    <line x1="30" y1="0" x2="35" y2="15" stroke="#F4B400" stroke-width="2"/>
    <circle cx="35" cy="17" r="3" fill="#F4B400"/>
  </g>
  
  <!-- Passport -->
  <g transform="translate(130, 430) rotate(-10)">
    <rect x="0" y="0" width="35" height="45" rx="4" fill="#690b1b"/>
    <circle cx="17" cy="18" r="8" fill="none" stroke="#F4B400" stroke-width="1.5"/>
    <line x1="9" y1="18" x2="25" y2="18" stroke="#F4B400" stroke-width="1"/>
    <line x1="17" y1="10" x2="17" y2="26" stroke="#F4B400" stroke-width="1"/>
    <rect x="8" y="30" width="19" height="2" rx="1" fill="#F4B400" opacity="0.6"/>
    <rect x="10" y="35" width="15" height="2" rx="1" fill="#F4B400" opacity="0.4"/>
  </g>
  
  <!-- Location pin -->
  <g transform="translate(500, 300)">
    <path d="M0 -20 C-12 -20 -18 -10 -18 -2 C-18 10 0 25 0 25 C0 25 18 10 18 -2 C18 -10 12 -20 0 -20Z" fill="#ED1C24" opacity="0.8"/>
    <circle cx="0" cy="-4" r="6" fill="#fff"/>
  </g>
  
  <!-- Stars / sparkles -->
  <g fill="#F4B400">
    <path d="M200 130 L203 138 L211 138 L205 143 L207 151 L200 146 L193 151 L195 143 L189 138 L197 138Z" opacity="0.7"/>
    <path d="M420 450 L422 456 L428 456 L423 459 L425 465 L420 462 L415 465 L417 459 L412 456 L418 456Z" opacity="0.6"/>
    <path d="M520 130 L521 134 L525 134 L522 136 L523 140 L520 138 L517 140 L518 136 L515 134 L519 134Z" opacity="0.5"/>
  </g>
  
  <!-- University building silhouette -->
  <g transform="translate(60, 300)" opacity="0.15">
    <rect x="0" y="20" width="60" height="40" fill="#690b1b"/>
    <rect x="10" y="0" width="40" height="20" fill="#690b1b"/>
    <polygon points="30,-15 5,0 55,0" fill="#690b1b"/>
    <rect x="8" y="30" width="8" height="10" fill="#FDF4F4"/>
    <rect x="22" y="30" width="8" height="10" fill="#FDF4F4"/>
    <rect x="36" y="30" width="8" height="10" fill="#FDF4F4"/>
    <rect x="22" y="5" width="8" height="10" rx="4" fill="#FDF4F4"/>
  </g>
</svg>
