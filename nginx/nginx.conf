events {
    worker_connections 1024;
}

http {
    # ─────────────────────────────────────────────
    # Upstream definitions
    # ─────────────────────────────────────────────
    upstream nextjs {
        server frontend:3000;
    }

    upstream fastapi {
        server backend:8000;
    }

    # ─────────────────────────────────────────────
    # Rate limiting
    # ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # ─────────────────────────────────────────────
    # HTTP → HTTPS redirect
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name admit.abroadsimplified.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────
    # HTTPS server
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name admit.abroadsimplified.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/live/admit.abroadsimplified.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/admit.abroadsimplified.com/privkey.pem;

        # SSL hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

        # Max upload size (for file uploads)
        client_max_body_size 50M;

        # ─── Backend API routes ───
        location /api/backend/ {
            limit_req zone=api burst=20 nodelay;

            # Strip the /api/backend prefix and forward to FastAPI
            rewrite ^/api/backend/(.*)$ /$1 break;
            proxy_pass http://fastapi;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Next.js (everything else) ───
        location / {
            proxy_pass http://nextjs;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Static assets caching ───
        location /_next/static/ {
            proxy_pass http://nextjs;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
